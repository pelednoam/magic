[project]
name = "mtgcoach-coach"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["mtgcoach-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtgcoach"]

[tool.uv.sources]
mtgcoach-core = { workspace = true }
