[project]
name = "mtgcoach-selfplay"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["mtgcoach-core", "mtgcoach-coach", "mtgcoach-carddata", "mtgcoach-api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtgcoach"]

[tool.uv.sources]
mtgcoach-core = { workspace = true }
mtgcoach-coach = { workspace = true }
mtgcoach-carddata = { workspace = true }
mtgcoach-api = { workspace = true }
