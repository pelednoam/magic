[project]
name = "mtgcoach-api"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "mtgcoach-core",
    "mtgcoach-coach",
    "mtgcoach-carddata",
    "fastapi>=0.115",
    # Imported at module scope, so declared here rather than relied on through
    # FastAPI: `app.py` imports starlette directly for its status codes, and
    # `serve.py` imports uvicorn to run.
    "starlette>=0.40",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtgcoach"]

[tool.uv.sources]
mtgcoach-core = { workspace = true }
mtgcoach-coach = { workspace = true }
mtgcoach-carddata = { workspace = true }
