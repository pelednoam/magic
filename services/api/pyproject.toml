[project]
name = "mtgcoach-api"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "mtgcoach-core",
    "mtgcoach-coach",
    "mtgcoach-carddata",
    "fastapi>=0.115",
    # Imported at module scope, so declared here rather than relied on through
    # FastAPI: `app.py` imports starlette directly for its status codes, and
    # `serve.py` imports uvicorn to run.
    "starlette>=0.40",
    # `[standard]` for the websocket implementation. Plain uvicorn has none,
    # so `serve.py` would start, answer HTTP, and refuse every socket -- which
    # the tests could not catch, because Starlette's TestClient runs its own
    # in-process websocket and never touches the server's.
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtgcoach"]

[tool.uv.sources]
mtgcoach-core = { workspace = true }
mtgcoach-coach = { workspace = true }
mtgcoach-carddata = { workspace = true }
