name: Mutation

# 100% coverage proves the lines ran, not that anything was asserted.
# This is the gate that catches vacuous tests. Nightly, because it is slow.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutmut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups

      # Paths come from [tool.mutmut] in pyproject.toml; mutmut 3 removed the
      # --paths-to-mutate flag and refuses to start without the config.
      - name: mutate packages/core
        run: uv run mutmut run

      # `mutmut run` exits 0 with survivors and `mutmut results` only prints,
      # so without this the job is green while the suite fails to detect
      # deliberately broken code.
      - name: fail on escaped mutants
        run: |
          set -o pipefail
          uv run mutmut results | uv run python tools/check_mutation_survivors.py
