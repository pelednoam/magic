name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the gate only reads the tree. Without this, jobs inherit
# whatever the repository default grants, which is often write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv python install 3.12
      - run: uv sync --all-groups

      # Each gate is its own step so a failure names itself in the UI rather
      # than hiding inside a shell script's output.
      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: ruff format
        run: uv run ruff format --check .

      - name: modules under 200 lines
        run: uv run python tools/check_file_length.py

      - name: coverage opt-outs inside the allowlist
        run: uv run python tools/check_pragma_allowlist.py

      - name: mypy --strict
        run: uv run mypy

      - name: pyright --strict
        run: uv run pyright

      - name: pytest with 100% branch coverage
        run: uv run pytest --cov --cov-branch --cov-report=term-missing
