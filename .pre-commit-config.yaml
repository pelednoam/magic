# Fast gates only. The full set (mypy, pyright, coverage) runs in tools/gate.sh
# and in CI; keeping the hook fast is what keeps it enabled.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: file-length
        name: modules stay under 200 lines
        entry: python tools/check_file_length.py
        language: system
        types: [python]

      - id: pragma-allowlist
        name: coverage opt-outs stay inside the allowlist
        entry: python tools/check_pragma_allowlist.py
        language: system
        types: [python]
